[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stems"
version = "0.1.0"
description = "Professional CLI audio stem separator (Demucs + UVR/Roformer)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Arnon Segal" }]
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
    "typer>=0.12",
    "rich>=13.0",
    "demucs>=4.0",
    # 0.44 replaced Roformer loading with a config-driven loader and added the
    # newer community checkpoints (see engines/uvr_engine.MODEL_FILES). It also
    # requires numpy>=2, which demucs 4.0.1 tolerates.
    "audio-separator>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["customtkinter>=5.2", "tkinterdnd2>=0.4"]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "python-multipart>=0.0.6"]

[project.scripts]
stems = "stems.cli:app"

[project.gui-scripts]
stems-gui = "stems.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
